<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">

    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <title>Óvoda Soundboard</title>
</head>

<body class="menu-closed">

<!-- STOP GOMB BAL FELSŐ SAROK -->
<button id="stopBtn" onclick="stopSound()"></button>

<!-- MENÜ IKON -->
<div id="menuBtn" onclick="togglePanel()">
    <div></div>
    <div></div>
    <div></div>
</div>

<!-- GOMBOK -->
<div id="buttons">

    <div class="btn-wrap">
        <span class="btn-label">Gomb 1</span>
        <button class="btn-sound" onclick="playSound(0)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 2</span>
        <button class="btn-sound" onclick="playSound(1)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 3</span>
        <button class="btn-sound" onclick="playSound(2)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 4</span>
        <button class="btn-sound" onclick="playSound(3)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 5</span>
        <button class="btn-sound" onclick="playSound(4)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 6</span>
        <button class="btn-sound" onclick="playSound(5)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 7</span>
        <button class="btn-sound" onclick="playSound(6)"></button>
    </div>

    <div class="btn-wrap">
        <span class="btn-label">Gomb 8</span>
        <button class="btn-sound" onclick="playSound(7)"></button>
    </div>

</div>

<!-- MENÜ PANEL -->
<div id="panel">

    <h3 class="mb-3">Beállítások</h3>

    <div id="menuList"></div>

    <!-- GOMB BEÁLLÍTÓ PANEL -->
    <div id="editPanel" class="subpanel">
        <h4 id="editTitle"></h4>

        <label>Kép feltöltése:</label>
        <div class="file-wrapper">
            <span id="imgLabel">Nincs</span>
            <input type="file" accept="image/*" id="imgUpload" class="file-input">
        </div>

        <label class="mt-3">Hang feltöltése:</label>
        <div class="file-wrapper">
            <span id="sndLabel">Nincs</span>
            <input type="file" accept="audio/*" id="sndUpload" class="file-input">
        </div>

        <button class="btn btn-secondary w-100 mt-4" onclick="closeEditPanel()">Vissza</button>
    </div>

    <!-- HÁTTÉR PANEL -->
    <div id="backgroundPanel" class="subpanel">
        <h4>Háttér cseréje</h4>

        <div class="file-wrapper">
            <span id="bgLabel">Nincs</span>
            <input type="file" accept="image/*" id="bgUpload" class="file-input">
        </div>

        <button class="btn btn-secondary w-100 mt-4" onclick="closeBackgroundPanel()">Vissza</button>
    </div>

</div>

<script>
let sounds = Array(8).fill(null);
let images = Array(8).fill(null);
let currentSound = null;

/* STOP GOMB FUNKCIÓ */
function stopSound() {
    if (currentSound) {
        currentSound.pause();
        currentSound.currentTime = 0;
    }
}

/* PANEL NYITÁS + FELIRAT ANIMÁCIÓ */
function togglePanel() {
    const panel = document.getElementById("panel");
    const labels = document.querySelectorAll(".btn-label");

    const isOpen = panel.style.right === "0px";

    if (isOpen) {
        panel.style.right = "-100%";
        document.body.classList.add("menu-closed");

        labels.forEach(label => {
            label.classList.remove("show");
            setTimeout(() => label.style.display = "none", 300);
        });

    } else {
        panel.style.right = "0px";
        document.body.classList.remove("menu-closed");

        labels.forEach(label => {
            label.style.display = "block";
            setTimeout(() => label.classList.add("show"), 10);
        });
    }
}

/* HANG FELTÖLTÉSE */
function setSound(event, index) {
    const file = event.target.files[0];
    if (file) {
        sounds[index] = new Audio(URL.createObjectURL(file));
        document.getElementById("sndLabel").innerText = file.name;
    }
}

/* KÉP FELTÖLTÉSE */
function setImage(event, index) {
    const file = event.target.files[0];
    if (file) {
        const url = URL.createObjectURL(file);
        images[index] = url;
        document.querySelectorAll(".btn-sound")[index].style.backgroundImage = `url('${url}')`;
        document.getElementById("imgLabel").innerText = "Kiválasztva";
    }
}

/* HÁTTÉR FELTÖLTÉSE */
function setBackground(event) {
    const file = event.target.files[0];
    if (file) {
        const url = URL.createObjectURL(file);
        document.body.style.backgroundImage = `url('${url}')`;
        document.getElementById("bgLabel").innerText = "Kiválasztva";
    }
}

/* HANG LEJÁTSZÁSA – csak EGY hang szólhat egyszerre */
function playSound(index) {
    if (currentSound) {
        currentSound.pause();
        currentSound.currentTime = 0;
    }

    if (sounds[index]) {
        currentSound = sounds[index];
        currentSound.currentTime = 0;
        currentSound.play();
    }
}

/* GOMB BEÁLLÍTÓ PANEL NYITÁSA */
function openEditPanel(index) {
    document.getElementById("menuList").style.display = "none";
    document.getElementById("backgroundPanel").style.display = "none";
    document.getElementById("editPanel").style.display = "block";

    document.getElementById("editTitle").innerText = `Gomb ${index+1} beállítása`;

    document.getElementById("imgUpload").value = "";
    document.getElementById("sndUpload").value = "";
    document.getElementById("imgLabel").innerText = "Nincs";
    document.getElementById("sndLabel").innerText = "Nincs";

    document.getElementById("imgUpload").onchange = (e) => setImage(e, index);
    document.getElementById("sndUpload").onchange = (e) => setSound(e, index);
}

/* GOMB BEÁLLÍTÓ PANEL BEZÁRÁSA */
function closeEditPanel() {
    document.getElementById("editPanel").style.display = "none";
    document.getElementById("menuList").style.display = "block";
}

/* HÁTTÉR PANEL NYITÁSA */
function openBackgroundPanel() {
    document.getElementById("menuList").style.display = "none";
    document.getElementById("editPanel").style.display = "none";
    document.getElementById("backgroundPanel").style.display = "block";

    document.getElementById("bgUpload").value = "";
    document.getElementById("bgLabel").innerText = "Nincs";

    document.getElementById("bgUpload").onchange = (e) => setBackground(e);
}

/* HÁTTÉR PANEL BEZÁRÁSA */
function closeBackgroundPanel() {
    document.getElementById("backgroundPanel").style.display = "none";
    document.getElementById("menuList").style.display = "block";
}

/* MENÜ LISTA FELTÖLTÉSE */
window.onload = () => {
    const menuList = document.getElementById("menuList");

    for (let i = 0; i < 8; i++) {
        menuList.innerHTML += `
            <button class="btn btn-danger w-100 mb-3" onclick="openEditPanel(${i})">
                Gomb ${i+1} beállítása
            </button>
        `;
    }

    menuList.innerHTML += `
        <button class="btn btn-dark w-100 mb-3" onclick="openBackgroundPanel()">
            Háttér cseréje
        </button>
    `;
};
</script>

<script src="bootstrap/js/bootstrap.min.js"></script>

</body>
</html>
